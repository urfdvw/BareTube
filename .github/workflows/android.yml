name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BARETUBE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/baretube.keystore"
          echo "BARETUBE_KEYSTORE=$RUNNER_TEMP/baretube.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          BARETUBE_KEYSTORE_PASSWORD: ${{ secrets.BARETUBE_KEYSTORE_PASSWORD }}
          BARETUBE_KEY_ALIAS: ${{ secrets.BARETUBE_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BareTube-apk
          path: android/app/build/outputs/apk/release/app-release.apk
